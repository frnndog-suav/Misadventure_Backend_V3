services:
  postgres:
    image: postgres:17-alpine
    container_name: misadventures-postgres
    environment:
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: misadventures
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U docker -d misadventures']
      interval: 2s
      timeout: 5s
      retries: 15

  backend:
    build: .
    container_name: misadventures-backend
    environment:
      PORT: 3333
      DATABASE_URL: postgresql://docker:docker@postgres:5432/misadventures
    ports:
      - '3333:3333'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
